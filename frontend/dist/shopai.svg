<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="#0a0a14"/>

  <!-- Gold gradient definition -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12121f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shopping bag body -->
  <rect x="22" y="40" width="56" height="42" rx="8" fill="url(#bagGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Bag handle -->
  <path d="M36 40 C36 28 64 28 64 40" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Gold "S" letter centered in bag -->
  <text x="50" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="url(#goldGrad)">S</text>

  <!-- Small sparkle top-right -->
  <circle cx="72" cy="22" r="4" fill="#fbbf24" opacity="0.9"/>
  <circle cx="82" cy="15" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="65" cy="14" r="2" fill="#fbbf24" opacity="0.5"/>
</svg>
